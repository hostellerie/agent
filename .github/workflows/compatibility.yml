name: Agent compatibility

on:
  push:
    branches:
      - develop-1.0
  pull_request:

jobs:
  php-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['5.6', '7.4', '8.1', '8.3']

    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Lint PHP sources
        shell: bash
        run: |
          set -e
          while IFS= read -r -d '' file; do
            php -l "$file"
          done < <(find . -type f \( -name '*.php' -o -name '*.inc' \) -print0)

      - name: Check PHP 5.6 source subset
        run: php tests/php56_compat.php

      - name: Check installable foundation
        run: php tests/foundation.php

      - name: Check optional Hub integration
        run: php tests/hub.php

      - name: Check navigation provider contract
        run: php tests/navigation.php

      - name: Check HTML machine discovery
        run: php tests/html_discovery.php

      - name: Check site description fallbacks
        run: php tests/site_description.php

      - name: Check admin language coverage
        run: php tests/admin_language.php
